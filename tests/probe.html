<!doctype html>
<meta charset="utf-8">
<title>WebRTC Guard — local probe</title>
<script>
  function check(realm) {
    try { const pc = new realm.RTCPeerConnection({ iceServers: [] }); pc.close(); return "created"; }
    catch (error) { return error.name; }
  }
  window.probeResults = { top: check(window), capture: typeof navigator.mediaDevices.getUserMedia };
  const blank = document.createElement("iframe");
  document.documentElement.append(blank);
  // Deliberately checks a fresh synchronous realm before content-script delivery.
  probeResults.synchronousBlank = check(blank.contentWindow);
  const srcdoc = document.createElement("iframe");
  srcdoc.srcdoc = '<script>parent.probeResults.srcdoc = parent.check(window);<\/script>';
  document.documentElement.append(srcdoc);
  const frame = document.createElement("iframe");
  frame.src = "frame.html";
  document.documentElement.append(frame);
</script>
