<!doctype html>
<html lang="en">

<title>WebRTC Guard store assets</title>

  .icon { width: 128px; height: 128px; display: grid; place-items: center; }

  .edge, .edge img { width: 300px; height: 300px; }
  .promo { width: 440px; height: 280px; background: #b54836; display: grid; place-items: center; }

</style>
<div class="icon" id="chrome-icon"><img src="logo.png" alt="WebRTC Guard"></div>
<div class="edge" id="edge-icon"><img src="logo.png" alt="WebRTC Guard"></div>
<div class="promo" id="small-promo"><img src="logo.png" alt="WebRTC Guard"></div>
</html>
